# Dry run of the release wheel builds for the targets the CI test matrix does
# not cover, so a first-time compile failure surfaces here instead of during
# the irreversible publish. Mirrors release.yml's jobs with `build` in place
# of `publish`.
name: Wheel dry run

on:
  workflow_dispatch:

jobs:
  dryrun-windows:
    name: Wheel dry run on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install protobuf compiler
        run: choco install protoc --yes

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64-pc-windows-msvc
          command: build
          args: --release -m python/Cargo.toml

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-windows-x86_64
          path: target/wheels/*.whl
          if-no-files-found: 'error'

  dryrun-mac-cross:
    name: Wheel dry run on Mac (cross x86_64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install protobuf compiler
        run: brew install protobuf

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64-apple-darwin
          command: build
          args: --release -m python/Cargo.toml

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-macos-x86_64
          path: target/wheels/*.whl
          if-no-files-found: 'error'
